# Native Streamlit theming, replacing the injected CSS that previously styled
# the metric cards and tabs. One accent colour, reserved for the verdict.

[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E6E9EF"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
